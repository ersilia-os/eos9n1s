Title: Hemozoin inhibitor prediction using simple physicochemical parameters
Description: Flags inhibitors of hemozoin formation, by which Plasmodium crystallises
  the haem released during haemoglobin digestion and the mechanism targeted by quinine
  and chloroquine. Huy and colleagues screened 9,600 compounds in a cell-free assay,
  confirmed 224 hits by dose-response against 199 random negatives, and fitted a multivariate
  logistic regression on three physicochemical properties, for AUC 0.736. Ersilia
  replicates that equation with RDKit logP, hydrogen bond donors and hydrogen count
  replacing the original ChemSpider values; the Bayesian variant is omitted as it
  needs refractive index.
