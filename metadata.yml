Title: Hemozoin inhibitor prediction using simple physicochemical parameters
Description: Flags inhibitors of hemozoin formation, the crystallisation process by
  which Plasmodium detoxifies haem released during haemoglobin digestion and the mechanism
  through which chloroquine acts. Huy and colleagues screened compounds for this activity
  and found that simple physicochemical properties predicted it well enough to build
  a usable model, without requiring structural information. Ersilia distributes a
  replicated version following the published approach.
